<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191d">
  <title>LDJ Frame Color Preview</title>
  <style>
    :root {color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f5f8; color:#1a1c20;}
    * {box-sizing:border-box}
    body {margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:24px}
    .panel {width:min(100%,500px); padding:24px; background:#fff; border:1px solid #dedfe4; border-radius:18px; box-shadow:0 12px 38px rgba(20,26,38,.08)}
    header {display:flex; justify-content:space-between; gap:14px; align-items:start; margin-bottom:23px}
    h1 {font-size:22px; letter-spacing:-.035em; line-height:1.2; font-weight:750; margin:0}
    .sub {color:#767a84; font-size:13px; margin:5px 0 0}
    .pill {background:#eeeef1; color:#454951; border-radius:99px; padding:4px 10px; font-size:11px; font-weight:650; white-space:nowrap}
    label {display:block; font-size:13px; font-weight:650; margin-bottom:7px}
    select {appearance:auto; width:100%; padding:12px 14px; border:1px solid #cdd0d6; border-radius:11px; color:#1d2025; background:white; font:inherit; font-size:14px; cursor:pointer}
    select:focus-visible,button:focus-visible {outline:3px solid #77a9ef;outline-offset:2px}
    .stage {display:flex; flex-direction:column; align-items:center; padding:25px 15px 19px; background:#f2f3f6; border-radius:14px; margin-top:15px; gap:14px}
    .card-preview {width:min(100%,230px); height:auto; filter:drop-shadow(0 8px 10px rgba(0,0,0,.17)); display:block}
    .color-caption {font-size:14px; font-weight:650; display:flex; align-items:center; gap:9px}
    .swatch {width:19px;height:19px;flex:none;border-radius:50%;border:1px solid #a9acb3;background:#478ac5}
    button {margin-top:15px; display:block; width:100%; padding:11px 14px; border:1px solid #d3d5da; border-radius:11px; background:white; color:#252930; cursor:pointer; font:inherit; font-weight:650; font-size:14px}
    button:hover {background:#f8f9fb}
    .footnote {margin:13px 0 0;color:#8b8e96;font-size:12px;line-height:1.4;text-align:center}
    @media (max-width:480px){body{padding:12px;align-items:start}.panel{padding:18px} h1{font-size:20px}}
    @media (prefers-reduced-motion:no-preference){.stage rect {transition:fill .18s ease}}
  </style>
</head>
<body>
<main class="panel">
  <header>
    <div><h1>LDJ Frame Color Preview</h1><p class="sub">Interactive card color selector</p></div>
    <span class="pill">Demo</span>
  </header>
  <label for="frame">Frame color</label>
  <select id="frame" aria-label="Frame color">
    <option value="auto">Auto · from mana</option>
    <optgroup label="Single-color and general frames">
      <option value="white">White</option>
      <option value="blue">Blue</option>
      <option value="black">Black</option>
      <option value="red">Red</option>
      <option value="green">Green</option>
      <option value="multi">Multicolor · Gold</option>
      <option value="colorless">Colorless</option>
      <option value="artifact">Artifact</option>
      <option value="land">Land</option>
    </optgroup>
    <optgroup label="Two-color hybrid frames">
      <option value="hybrid-WU">White / Blue · Azorius</option>
      <option value="hybrid-UB">Blue / Black · Dimir</option>
      <option value="hybrid-BR">Black / Red · Rakdos</option>
      <option value="hybrid-RG">Red / Green · Gruul</option>
      <option value="hybrid-GW">Green / White · Selesnya</option>
      <option value="hybrid-WB">White / Black · Orzhov</option>
      <option value="hybrid-UR">Blue / Red · Izzet</option>
      <option value="hybrid-BG">Black / Green · Golgari</option>
      <option value="hybrid-RW">Red / White · Boros</option>
      <option value="hybrid-GU">Green / Blue · Simic</option>
    </optgroup>
  </select>
  <section class="stage" aria-label="Live card frame preview">
    <svg class="card-preview" viewBox="0 0 210 292" role="img" aria-label="LDJ Sample trading card preview" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Crisp 50/50 split, following the hybrid card maker's .49/.51 stops. -->
        <linearGradient id="outer-hybrid" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#c8b88f"/>
          <stop offset="49%" stop-color="#c8b88f"/>
          <stop offset="51%" stop-color="#206fb2"/>
          <stop offset="100%" stop-color="#206fb2"/>
        </linearGradient>
        <linearGradient id="trim-hybrid" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#fff4d8"/>
          <stop offset="49%" stop-color="#fff4d8"/>
          <stop offset="51%" stop-color="#a4dbf5"/>
          <stop offset="100%" stop-color="#a4dbf5"/>
        </linearGradient>
      </defs>
      <rect x="1" y="1" width="208" height="290" rx="10" fill="#08090a"/>
      <rect class="outer" x="8" y="8" width="194" height="276" rx="8" fill="#478ac5" stroke="#121212" stroke-width="2"/>
      <rect class="trim" x="13" y="13" width="184" height="26" rx="8" fill="#9dd2ed" stroke="#141414" stroke-width="2"/>
      <text x="22" y="30" font-size="13" font-weight="bold" font-family="Georgia,serif" fill="#111">LDJ Sample</text>
      <circle cx="179" cy="26" r="8" fill="#dce6ea" stroke="#161616" stroke-width="2"/>
      <rect x="14" y="43" width="182" height="123" fill="#64717e" stroke="#131313" stroke-width="2"/>
      <path d="M15 145 Q105 75 195 145 L195 165 L15 165Z" fill="#344451"/>
      <circle cx="104" cy="92" r="28" fill="#a9bdcc" opacity=".6"/>
      <rect class="trim" x="13" y="169" width="184" height="23" rx="7" fill="#9dd2ed" stroke="#111" stroke-width="2"/>
      <text x="22" y="185" font-size="11" font-weight="bold" font-family="Georgia,serif" fill="#111">Creature — Wizard</text>
      <rect x="14" y="196" width="182" height="74" fill="#f4f0e8" stroke="#161616" stroke-width="2"/>
      <path d="M23 209 H173 M23 219 H166 M23 229 H178 M23 239 H139" stroke="#9a9a9a" stroke-width="2.5" stroke-linecap="round"/>
      <rect class="trim" x="145" y="255" width="46" height="20" rx="6" fill="#9dd2ed" stroke="#111" stroke-width="2"/>
      <text x="168" y="269" font-size="12" font-family="Georgia,serif" font-weight="bold" text-anchor="middle" fill="#111">2/3</text>
    </svg>
    <div class="color-caption"><span class="swatch" id="swatch"></span><span id="frame-name" aria-live="polite">Automatic frame</span></div>
  </section>
  <button id="reset" type="button">↶ &nbsp;Reset to Automatic</button>
  <p class="footnote">Standalone color demonstration. “Auto” displays the default blue frame; automatic mana detection is part of the full card maker.</p>
</main>
<script>
  'use strict';

  // Original prototype's single-color palette remains unchanged.
  const frames = {
    auto:{name:'Automatic',outer:'#478ac5',trim:'#9dd2ed'},
    white:{name:'White',outer:'#c8b88f',trim:'#fff4d8'},
    blue:{name:'Blue',outer:'#206fb2',trim:'#a4dbf5'},
    black:{name:'Black',outer:'#39333f',trim:'#77707d'},
    red:{name:'Red',outer:'#b33a2b',trim:'#e6a08a'},
    green:{name:'Green',outer:'#3e744d',trim:'#a0c9a0'},
    multi:{name:'Multicolor · Gold',outer:'#997333',trim:'#e8ca74'},
    colorless:{name:'Colorless',outer:'#6b7478',trim:'#d6d4cd'},
    artifact:{name:'Artifact',outer:'#7c96a0',trim:'#dbe7e7'},
    land:{name:'Land',outer:'#8a7757',trim:'#cdc6aa'}
  };

  // The same ten color pairs and left/right ordering as the hybrid card maker.
  // A hybrid frame uses each color's existing outer and trim swatches.
  const hybridPairs = {
    WU:['Azorius','white','blue'],
    UB:['Dimir','blue','black'],
    BR:['Rakdos','black','red'],
    RG:['Gruul','red','green'],
    GW:['Selesnya','green','white'],
    WB:['Orzhov','white','black'],
    UR:['Izzet','blue','red'],
    BG:['Golgari','black','green'],
    RW:['Boros','red','white'],
    GU:['Simic','green','blue']
  };
  for (const [pair, [guild, left, right]] of Object.entries(hybridPairs)) {
    frames['hybrid-' + pair] = {
      name:`${guild} · ${frames[left].name} / ${frames[right].name}`,
      hybrid:true,
      left:frames[left],
      right:frames[right]
    };
  }

  const picker = document.getElementById('frame');
  const outer = document.querySelector('.outer');
  const trims = document.querySelectorAll('.trim');
  const swatch = document.getElementById('swatch');
  const frameName = document.getElementById('frame-name');

  function setSplitStops(id, left, right) {
    const stops = document.querySelectorAll(`#${id} stop`);
    [left, left, right, right].forEach((color, index) => {
      stops[index].setAttribute('stop-color', color);
    });
  }

  function update() {
    const selected = frames[picker.value] || frames.auto;
    if (selected.hybrid) {
      setSplitStops('outer-hybrid', selected.left.outer, selected.right.outer);
      setSplitStops('trim-hybrid', selected.left.trim, selected.right.trim);
      outer.setAttribute('fill', 'url(#outer-hybrid)');
      trims.forEach(node => node.setAttribute('fill', 'url(#trim-hybrid)'));
      swatch.style.background = `linear-gradient(to right, ${selected.left.outer} 49%, ${selected.right.outer} 51%)`;
    } else {
      outer.setAttribute('fill', selected.outer);
      trims.forEach(node => node.setAttribute('fill', selected.trim));
      swatch.style.background = selected.outer;
    }
    frameName.textContent = selected.name + ' frame';
  }

  picker.addEventListener('change', update);
  document.getElementById('reset').addEventListener('click', () => {
    picker.value = 'auto';
    update();
  });
  update();
</script>
</body>
</html>
